name: cd

on:
  push:
    tags:
      - 'v*.*.*'

permissions: {}

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      -
        name: Check homebrew taps token
        run: |
          push=$(gh api repos/snowplow/homebrew-taps --jq .permissions.push)
          if [ "$push" != "true" ]; then
            echo "::error::HOMEBREW_TAPS_GITHUB_TOKEN has no push access to snowplow/homebrew-taps"
            exit 1
          fi
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAPS_GITHUB_TOKEN }}
      -
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 'latest'
          package-manager-cache: false
          registry-url: 'https://registry.npmjs.org'
      -
        name: Check npm token
        run: npm whoami
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PUBLISHING_AUTOMATION_TOKEN }}

  goreleaser:
    needs: preflight
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      -
        name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      -
        name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: 'go.mod'
          cache: false
      -
        name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          # 'latest', 'nightly', or a semver
          version: 'latest'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAPS_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAPS_GITHUB_TOKEN }}
      -
        name: Get tag without 'v' prefix
        run: echo "SNP_CLI_VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV
      -
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PUBLISHING_AUTOMATION_TOKEN }}
        with:
          node-version: 'latest'
          package-manager-cache: false
          registry-url: 'https://registry.npmjs.org'
      -
        name: Publish npm packages
        run: cd npm && version="$SNP_CLI_VERSION" ./create-platform-packages.sh
