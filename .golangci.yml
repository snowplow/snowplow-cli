version: "2"
linters:
  default: all
  disable:
    - exhaustruct
    - exhaustruct_v5
    - gomodguard
    - mnd
    - nlreturn
    - varnamelen
    - wsl
    - wsl_v5
    - bodyclose
    - cyclop
    - depguard
    - dupl
    - err113
    - errchkjson
    - forbidigo
    - funlen
    - gochecknoglobals
    - gochecknoinits
    - goconst
    - gosec
    - lll
    - nilnil
    - noctx
    - noinlineerr
    - paralleltest
    - prealloc
    - revive
    - sloglint
    - tagliatelle
    - testpackage
    - thelper
    - usetesting
    - wrapcheck
  settings:
    gocognit:
      min-complexity: 84
    gocyclo:
      min-complexity: 42
    maintidx:
      under: 16
    misspell:
      ignore-rules:
        - avaliable
    nestif:
      min-complexity: 16
  exclusions:
    presets:
      - std-error-handling
      - common-false-positives
    rules:
      - linters:
          - errcheck
        text: "Error return value of.*Printf.* is not checked"
