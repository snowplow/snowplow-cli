version: "2"
linters:
  default: all
  disable:
    - exhaustruct
    - exhaustruct_v5
    - gomodguard
    - mnd
    - nlreturn
    - varnamelen
    - wsl
    - wsl_v5
    - depguard
    - dupl
    - err113
    - forbidigo
    - gochecknoglobals
    - gochecknoinits
    - goconst
    - gosec
    - lll
    - nilnil
    - noinlineerr
    - paralleltest
    - prealloc
    - revive
    - tagliatelle
    - testpackage
    - wrapcheck
  settings:
    cyclop:
      max-complexity: 17
    funlen:
      lines: 295
    goheader:
      template: |-
        Copyright (c) 2013-present Snowplow Analytics Ltd.
        All rights reserved.
        This software is made available by Snowplow Analytics, Ltd.,
        under the terms of the Snowplow Limited Use License Agreement, Version 1.0
        located at https://docs.snowplow.io/limited-use-license-1.0
        BY INSTALLING, DOWNLOADING, ACCESSING, USING OR DISTRIBUTING ANY PORTION
        OF THE SOFTWARE, YOU AGREE TO THE TERMS OF SUCH LICENSE AGREEMENT.
  exclusions:
    presets:
      - std-error-handling
      - common-false-positives
    rules:
      - linters:
          - errcheck
        text: "Error return value of.*Printf.* is not checked"
