version: "2"
linters:
  default: all
  disable:
    - exhaustruct
    - exhaustruct_v5
    - gomodguard
    - mnd
    - nlreturn
    - varnamelen
    - wsl
    - wsl_v5
    - bodyclose
    - canonicalheader
    - cyclop
    - depguard
    - dupl
    - err113
    - errchkjson
    - forbidigo
    - funlen
    - gochecknoglobals
    - gochecknoinits
    - gocognit
    - goconst
    - gocyclo
    - gosec
    - lll
    - maintidx
    - nestif
    - nilnil
    - noctx
    - noinlineerr
    - nonamedreturns
    - paralleltest
    - perfsprint
    - prealloc
    - revive
    - sloglint
    - tagalign
    - tagliatelle
    - testpackage
    - thelper
    - usestdlibvars
    - usetesting
    - whitespace
    - wrapcheck
  settings:
    misspell:
      ignore-rules:
        - avaliable
  exclusions:
    presets:
      - std-error-handling
      - common-false-positives
    rules:
      - linters:
          - errcheck
        text: "Error return value of.*Printf.* is not checked"
